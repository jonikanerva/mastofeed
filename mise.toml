# Source of truth for the tool versions and the command surface (STACK.md §1
# and §3). The Rust version comes only from rust-toolchain.toml.
#
# A fresh machine: install mise and rustup, then run `mise trust` and
# `mise run setup` in the repository root.
[settings]
idiomatic_version_file_enable_tools = ["rust"]
# `mise outdated`, `mise latest`, and `mise upgrade` consider only releases
# that are at least 24 hours old (STACK.md §15 Dependencies). The rule needs
# release dates from the backend. The exact pins below install as written.
minimum_release_age = "24h"

[env]
# The only PostgreSQL version setting of the local servers (STACK.md §3 and
# §15 Infrastructure). The major version follows production (Neon
# PostgreSQL 18). The digest pins the multi-platform image index; the tag is
# for people. scripts/db.sh runs every local server from this image in an
# Apple container; the Mac has no PostgreSQL install.
MASTOFEED_PG_IMAGE = "docker.io/library/postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc"

[tools]
# SQLx CLI: migrations of the test database and the query metadata check.
# mise keeps one install per tool version for all projects. Another project
# of the owner (caltodo) pins the same version with these exact options; a
# different option set makes each project reinstall it on every run, and the
# binary is missing while the other project installs it. Keep the options
# equal to that pin.
"cargo:sqlx-cli" = { version = "0.9.0", default-features = false, features = "postgres,rustls", locked = true }
# Release binary; mise checks the SHA-256 of the aqua registry.
cargo-deny = "0.20.2"
# Release binary; mise checks the SHA-256 of the aqua registry.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.152"
# Release binary; mise checks the GitHub asset digest and the GitHub artifact
# attestation. The project publishes no checksum file.
"github:Boshen/cargo-shear" = "1.14.1"
gitleaks = "8.30.1"

# Local PostgreSQL (STACK.md §3). scripts/db.sh starts every server in an
# Apple container. The tests and the query checks get a new test server per
# run and set DATABASE_URL to it, so a DATABASE_URL in the shell or in
# .env.local cannot reach them. `dev` and `migrate` use the dev server of
# this worktree unless MASTOFEED_DATABASE_URL is set.
#
# The local settings of the service are in .env.local, not .env: the SQLx
# query macros parse every .env file in the crate directory and its parents
# at compile time, also with SQLX_OFFLINE, and an unquoted value with spaces
# (CRON_SCHEDULE=*/5 * * * *) stops the build.

[tasks.setup]
description = "Install the pinned tools, fetch the locked dependencies, check the container tool, fetch the PostgreSQL image"
run = ["mise install", "cargo fetch --locked", "scripts/db.sh setup"]

[tasks."db:start"]
description = "Start the dev PostgreSQL of this worktree (a container with a persistent volume)"
run = "scripts/db.sh start"

[tasks."db:stop"]
description = "Stop the dev PostgreSQL of this worktree; the data stays in its volume"
run = "scripts/db.sh stop"

[tasks."db:info"]
description = "Show the container, version, port, and database of this worktree's servers"
run = "scripts/db.sh info"

[tasks."db:psql"]
description = "Open psql on the dev PostgreSQL of this worktree"
raw = true
run = "scripts/db.sh psql"

[tasks."db:gc"]
description = "Remove abandoned test servers and the kept test servers of this worktree"
run = "scripts/db.sh gc"

[tasks.format]
description = "Format the Rust sources"
run = "cargo fmt --all"

[tasks.format-check]
description = "Fail on a formatting difference; change no file"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Clippy on every target, warnings are errors"
env = { SQLX_OFFLINE = "true" }
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."sqlx:prepare"]
description = "Regenerate .sqlx query metadata from a new test server"
run = "scripts/db.sh with-test-db -- scripts/db.sh sqlx prepare"

[tasks."sqlx:check"]
description = "Fail when .sqlx differs from the queries and the migrated schema"
run = "scripts/db.sh with-test-db -- scripts/db.sh sqlx check"

[tasks."scan:secrets"]
description = "Gitleaks on the history, the staged changes, and the unstaged changes of tracked files"
# Untracked files such as .env.local are not scanned.
run = [
  "gitleaks git --no-banner --redact --log-level warn --config .gitleaks.toml .",
  "gitleaks git --staged --no-banner --redact --log-level warn --config .gitleaks.toml .",
  "gitleaks git --pre-commit --no-banner --redact --log-level warn --config .gitleaks.toml .",
]

[tasks."scan:deps"]
description = "cargo-deny (advisories, bans, licences, sources) and cargo-shear"
run = ["cargo deny --locked check", "cargo shear --deny-warnings"]

[tasks.build]
description = "The locked release build with the committed query metadata"
env = { SQLX_OFFLINE = "true" }
run = "cargo build --release --locked --package mastofeed-server"

[tasks.test]
description = "Nextest and the doc tests against a new test server"
env = { SQLX_OFFLINE = "true" }
run = "scripts/db.sh with-test-db -- sh -c 'cargo nextest run --workspace --locked --no-tests=fail && cargo test --doc --workspace --locked'"

[tasks.verify]
description = "The full verification (VERIFY_CMD); stops at the first failed step"
# One test server for all steps: --share lets the nested sqlx:check and test
# tasks use it. An independent run beside verify gets its own server.
run = "scripts/db.sh with-test-db --share -- mise run verify:steps"

[tasks."verify:steps"]
description = "The steps of verify; run verify instead"
hide = true
run = [
  { task = "format-check" },
  { task = "lint" },
  { task = "sqlx:check" },
  { task = "scan:secrets" },
  { task = "scan:deps" },
  { task = "build" },
  { task = "test" },
]

# SQLX_OFFLINE: the query macros use .sqlx, not a database.
# `dev` runs `migrate` before `serve`, like the production start command.
[tasks.dev]
description = "Run the service with .env.local, readable logs, and the dev PostgreSQL of this worktree"
env = { _.file = ".env.local", LOG_FORMAT = "text", SQLX_OFFLINE = "true" }
raw = true
run = "scripts/db.sh with-dev-db -- sh -c 'cargo run --locked --package mastofeed-server -- migrate && exec cargo run --locked --package mastofeed-server -- serve'"

[tasks.migrate]
description = "Apply the migrations to the dev PostgreSQL of this worktree (or MASTOFEED_DATABASE_URL)"
env = { _.file = ".env.local", SQLX_OFFLINE = "true" }
run = "scripts/db.sh with-dev-db -- cargo run --locked --package mastofeed-server -- migrate"

[tasks."pg:rehearse"]
description = "Rehearse a PostgreSQL major upgrade with pg_upgrade in containers: mise run pg:rehearse <old tag> <new tag>"
depends = ["build"]
run = "scripts/pg-upgrade-rehearsal.sh"

[tasks.parity]
description = "Owner-run: compare the TypeScript and the Rust feed on the live timeline of .env.local"
depends = ["build"]
# The script gets its own test server; the DATABASE_URL of .env.local is
# replaced.
env = { _.file = ".env.local" }
raw = true
run = "scripts/db.sh with-test-db -- scripts/parity.sh"
