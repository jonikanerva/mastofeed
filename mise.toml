# Source of truth for the tool versions and the command surface (STACK.md §1
# and §3). The Rust version comes only from rust-toolchain.toml.
#
# A fresh machine: install mise and rustup, then run `mise trust` and
# `mise run setup` in the repository root.
[settings]
idiomatic_version_file_enable_tools = ["rust"]
# `mise outdated`, `mise latest`, and `mise upgrade` consider only releases
# that are at least 24 hours old (STACK.md §15 Dependencies). The rule needs
# release dates from the backend; conda (PostgreSQL) reports none, so mise
# does not filter it. The exact pins below install as written.
minimum_release_age = "24h"

[tools]
# The PostgreSQL major version of production (Railway Postgres 17).
"conda:postgresql" = "17.11"
# SQLx CLI: migrations of the test database and the query metadata check.
# mise keeps one install per tool version for all projects. Another project
# of the owner (caltodo) pins the same version with these exact options; a
# different option set makes each project reinstall it on every run, and the
# binary is missing while the other project installs it. Keep the options
# equal to that pin.
"cargo:sqlx-cli" = { version = "0.9.0", default-features = false, features = "postgres,rustls", locked = true }
# Release binary; mise checks the SHA-256 of the aqua registry.
cargo-deny = "0.20.2"
# Release binary; mise checks the SHA-256 of the aqua registry.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
# Release binary; mise checks the GitHub asset digest and the GitHub artifact
# attestation. The project publishes no checksum file.
"github:Boshen/cargo-shear" = "1.14.0"
gitleaks = "8.30.1"

# The tests and the query checks use only the isolated server of
# scripts/test-db.sh. Their tasks set DATABASE_URL themselves, so a
# DATABASE_URL in the shell or in .env.local cannot reach them.
#
# The local settings of the service are in .env.local, not .env: the SQLx
# query macros parse every .env file in the crate directory and its parents
# at compile time, also with SQLX_OFFLINE, and an unquoted value with spaces
# (CRON_SCHEDULE=*/5 * * * *) stops the build.

[tasks.setup]
description = "Install the pinned tools and fetch the locked dependencies"
run = ["mise install", "cargo fetch --locked"]

[tasks."db:start"]
description = "Start the isolated test PostgreSQL on 127.0.0.1:55432 and migrate it"
run = "scripts/test-db.sh start"

[tasks."db:stop"]
description = "Stop the isolated test PostgreSQL"
run = "scripts/test-db.sh stop"

[tasks.format]
description = "Format the Rust sources"
run = "cargo fmt --all"

[tasks.format-check]
description = "Fail on a formatting difference; change no file"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Clippy on every target, warnings are errors"
env = { SQLX_OFFLINE = "true" }
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."sqlx:prepare"]
description = "Regenerate .sqlx query metadata from the isolated database"
depends = ["db:start"]
env = { DATABASE_URL = "postgres://postgres@127.0.0.1:55432/mastofeed_dev" }
run = "cargo sqlx prepare --no-dotenv --workspace -- --all-targets --locked"

[tasks."sqlx:check"]
description = "Fail when .sqlx differs from the queries and the migrated schema"
depends = ["db:start"]
env = { DATABASE_URL = "postgres://postgres@127.0.0.1:55432/mastofeed_dev" }
run = "cargo sqlx prepare --no-dotenv --workspace --check -- --all-targets --locked"

[tasks."scan:secrets"]
description = "Gitleaks on the history, the staged changes, and the unstaged changes of tracked files"
# Untracked files such as .env.local are not scanned.
run = [
  "gitleaks git --no-banner --redact --log-level warn --config .gitleaks.toml .",
  "gitleaks git --staged --no-banner --redact --log-level warn --config .gitleaks.toml .",
  "gitleaks git --pre-commit --no-banner --redact --log-level warn --config .gitleaks.toml .",
]

[tasks."scan:deps"]
description = "cargo-deny (advisories, bans, licences, sources) and cargo-shear"
run = ["cargo deny --locked check", "cargo shear --deny-warnings"]

[tasks.build]
description = "The locked release build with the committed query metadata"
env = { SQLX_OFFLINE = "true" }
run = "cargo build --release --locked --package mastofeed-server"

[tasks.test]
description = "Nextest and the doc tests against the isolated database"
depends = ["db:start"]
env = { DATABASE_URL = "postgres://postgres@127.0.0.1:55432/mastofeed_dev", SQLX_OFFLINE = "true" }
run = [
  "cargo nextest run --workspace --locked --no-tests=fail",
  "cargo test --doc --workspace --locked",
]

[tasks.verify]
description = "The full verification (VERIFY_CMD); stops at the first failed step"
run = [
  { task = "format-check" },
  { task = "lint" },
  { task = "sqlx:check" },
  { task = "scan:secrets" },
  { task = "scan:deps" },
  { task = "build" },
  { task = "test" },
]

# SQLX_OFFLINE: the query macros use .sqlx, not the database of .env.local.
[tasks.dev]
description = "Run the service with .env.local and readable logs"
env = { _.file = ".env.local", LOG_FORMAT = "text", SQLX_OFFLINE = "true" }
raw = true
run = "cargo run --locked --package mastofeed-server -- serve"

[tasks.migrate]
description = "Apply the migrations to the database of .env.local"
env = { _.file = ".env.local", SQLX_OFFLINE = "true" }
run = "cargo run --locked --package mastofeed-server -- migrate"

[tasks.parity]
description = "Owner-run: compare the TypeScript and the Rust feed on the live timeline of .env.local"
depends = ["db:start", "build"]
# The script replaces DATABASE_URL with a database on the isolated server.
env = { _.file = ".env.local" }
raw = true
run = "scripts/parity.sh"
