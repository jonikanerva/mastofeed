[package]
name = "mastofeed-server"
version = "0.1.0"
description = "Mastodon timeline poller and JSON Feed server"
# Railpack 0.40.1 cannot read inherited package fields in the binary crate
# (STACK.md §15). Keep these values equal to the workspace values.
edition = "2024"
rust-version = "1.99"
publish = false
license = "LicenseRef-Proprietary"

[[bin]]
name = "mastofeed"
path = "src/main.rs"

[dependencies]
mastofeed-domain.workspace = true
axum.workspace = true
croner.workspace = true
futures-util.workspace = true
jiff.workspace = true
jiff-sqlx.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

[lints]
workspace = true
